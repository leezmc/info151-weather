<!DOCTYPE html>
<!-- saved from url=(0051)file:///C:/Users/zuham/Downloads/houston%20(1).html -->
<html lang="en-US"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Houston — 151 Weather</title>
        <!--External stylesheets for layout and color themes-->
        <link rel="stylesheet" href="file:///C:/Users/zuham/css/styles.css">
        <link rel="stylesheet" href="file:///C:/Users/zuham/css/theme.css">
    </head>
    <body>
        <!-- theme-houston applies the Houston color palette
             data-city tells weather.js which coordinates to use for the API fetch -->
        <div class="weather-app theme-houston" data-city="houston">
            <!-- Site header: displays the app logo, title, and the Fahrenheit/Celsius toggle button -->
            <header class="app-header">
                <span class="header-icon">☀️</span>
                <h1 class="app-title">151 Weather</h1>
                <!-- Toggle button to switch display between Fahrenheit and Celsius.-->
                <button class="unit-toggle" id="unit-toggle">°C</button>
            </header>
            <!-- Links to all three city pages, highlights tab of current page. -->
            <nav class="page-nav">
                <a class="page-btn" href="file:///C:/Users/zuham/Downloads/philadelphia.html">Philadelphia</a>
                <a class="page-btn" href="file:///C:/Users/zuham/Downloads/new-york.html">New York</a>
                <a class="page-btn" href="file:///C:/Users/zuham/Downloads/juneau.html">Juneau</a>
                <a class="page-btn active" href="file:///C:/Users/zuham/Downloads/houston.html">Houston</a>
            </nav>
            <section class="page">
                <div class="weather-card">
                    <h2 class="city-name">Houston</h2>
                    <!-- Placeholders before data is fetched from API, replaced with data from API -->
                    <section class="current-weather">
                        <p class="condition" id="condition">Loading…</p>
                        <p class="temperature" id="temperature">--°F</p>
                        <p class="temp-range" id="temp-range">
                            High: --°F &nbsp; Low: --°F
                        </p>
                    </section>
                    <!--Other weather conditions fetched from API-->
                    <section class="weather-details">
                        <p class="detail-item">
                            <span class="detail-label">Humidity:</span>
                            <span class="detail-value" id="humidity">--%</span>
                        </p>
                        <p class="detail-item">
                            <span class="detail-label">Air Quality:</span>
                            <span class="detail-value" id="air-quality">--</span>
                        </p>
                        <p class="detail-item">
                            <span class="detail-label">Chance Of Rain:</span>
                            <span class="detail-value" id="rain-chance">--%</span>
                        </p>
                    </section>
                    <!-- Image of map of Houston-->
                    <div>
                        <img class="city-map" id="city-map" src="file:///C:/Users/zuham/img/Houston-map.png" alt="Map of Houston">
                    </div>
                </div>
            </section>
        </div>
        <!-- External JS for API, toggle button, unit conversion, etc. -->
        <script src="file:///C:/Users/zuham/js/weather.js"></script>
    

</body></html>
